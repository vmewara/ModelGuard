name: ModelGuard Daily Monitoring

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily monitoring update
        run: python app.py --daily-update

      - name: Save updated monitoring files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- data/simulated monitoring

          if ! git diff --cached --quiet; then
            git commit -m "Automated ModelGuard daily monitoring update"
            git push origin main
          else
            echo "No tracked monitoring changes to commit."
          fi